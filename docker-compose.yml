name: motor-de-conteudo

services:
  postgres:
    image: postgres:16-alpine
    container_name: mdc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postex}
      POSTGRES_DB: ${POSTGRES_DB:-postex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postex} -d ${POSTGRES_DB:-postex}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mdc-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Registro oficial da MinIO. As imagens nao estao mais publicadas no Docker Hub.
  # O bucket e criado pela propria API no startup (StorageService.ensure_bucket),
  # por isso nao existe um container de inicializacao aqui.
  minio:
    image: quay.io/minio/minio:latest
    container_name: mdc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      # Necessario para que o browser possa fazer PUT direto via URL assinada.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-*}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./backend
    container_name: mdc-api
    command: ["api"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postex}:${POSTGRES_PASSWORD:-postex}@postgres:5432/${POSTGRES_DB:-postex}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
    container_name: mdc-worker
    command: ["worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postex}:${POSTGRES_PASSWORD:-postex}@postgres:5432/${POSTGRES_DB:-postex}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      AI_EXECUTION_MODE: celery
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  redis_data:
  minio_data:
