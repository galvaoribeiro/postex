[tool.pytest.ini_options]
asyncio_mode = "auto"
# Um unico event loop para toda a sessao: a engine do SQLAlchemy e criada no
# import do modulo, e suas conexoes asyncpg ficam presas ao loop onde nasceram.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:botocore.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "ASYNC", "RUF"]
ignore = [
    "B008",    # Depends() em default de argumento e o idioma do FastAPI
    "RUF001",  # textos em portugues sem acento nao sao caracteres ambiguos
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"app/models/*" = ["RUF012"]
